name: Restore self-host secrets

# SortedMate fork. Copies every Worker secret from a known-good earlier
# version into a new, undeployed version, so the next "Deploy self-host"
# keeps them (scripts/selfhost-restore-secrets.mjs explains how). Run it
# only after a deploy lost secrets, then run "Deploy self-host". It changes
# no live traffic.

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: open-seo-selfhost version id that still has the secrets
        required: true
        default: 8bda6ae2-4d46-4de9-9bf5-ad43365f7534
      audit_version:
        description: open-seo-selfhost-audit version id that still has the secrets
        required: true
        default: 4994f7ee-59ef-48f3-b85c-095c318e7d03

concurrency:
  group: deploy-selfhost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    if: github.repository == 'SortedMateUK/open-seo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy secrets into carrier versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_VERSION: ${{ inputs.app_version }}
          AUDIT_VERSION: ${{ inputs.audit_version }}
        run: >-
          node scripts/selfhost-restore-secrets.mjs
          "open-seo-selfhost=$APP_VERSION"
          "open-seo-selfhost-audit=$AUDIT_VERSION"
